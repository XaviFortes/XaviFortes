name: Metrics

on:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/metrics.yml"
      - ".github/metrics.css"

concurrency:
  group: metrics
  cancel-in-progress: false

jobs:
  # Self-hosted stat cards: everything comes from the GraphQL API and is
  # rendered locally, so the README never depends on a third-party card
  # service staying online.
  cards:
    name: Render xfOS cards
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Render
        env:
          GITHUB_TOKEN: ${{ secrets.METRICS_TOKEN || secrets.GITHUB_TOKEN }}
        run: python3 tools/xfos-cards.py --user "${{ github.repository_owner }}"

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/gen
          if git diff --cached --quiet; then
            echo "no change"
            exit 0
          fi
          git commit -m "chore(cards): refresh xfOS panels [skip ci]"
          git pull --rebase --autostash
          git push

  panels:
    name: Render xfOS panels
    runs-on: ubuntu-latest
    # Ordered after `cards` so the two jobs never race on a push, but a card
    # failure must not take the metrics panels down with it.
    needs: cards
    if: ${{ !cancelled() }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      # The xfOS skin lives in one file so every panel stays in sync.
      - name: Load xfOS skin
        id: skin
        run: |
          {
            echo 'css<<xfOS_EOF'
            cat .github/metrics.css
            echo 'xfOS_EOF'
          } >> "$GITHUB_OUTPUT"

      # ------------------------------------------------------- 01 / overview --
      - name: Overview
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          committer_token: ${{ secrets.GITHUB_TOKEN }}
          committer_message: "chore(metrics): overview [skip ci]"
          filename: metrics/overview.svg
          template: terminal
          base: header, activity, community, repositories, metadata
          config_timezone: Europe/Madrid
          config_animations: yes
          extras_css: ${{ steps.skin.outputs.css }}
          plugins_errors_fatal: no
          retries: 3
          retries_delay: 120
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year
          plugin_achievements: yes
          plugin_achievements_display: compact
          plugin_achievements_threshold: C

      # ------------------------------------------------------ 02 / languages --
      - name: Language analysis
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          committer_token: ${{ secrets.GITHUB_TOKEN }}
          committer_message: "chore(metrics): languages [skip ci]"
          filename: metrics/languages.svg
          template: terminal
          base: ""
          config_timezone: Europe/Madrid
          extras_css: ${{ steps.skin.outputs.css }}
          plugins_errors_fatal: no
          retries: 3
          retries_delay: 120
          plugin_languages: yes
          plugin_languages_sections: most-used, recently-used
          plugin_languages_details: percentage, bytes-size
          plugin_languages_limit: 10
          plugin_languages_recent_days: 30
          plugin_languages_recent_load: 400
          # cyan ramp with an amber tail, so the bars read as one xfOS palette
          plugin_languages_colors: >-
            0:22E6FF, 1:19C3E0, 2:12A0C1, 3:0F8AA8, 4:0C7189,
            5:FFB020, 6:C98A1D, 7:8C6417, 8:4C7480, 9:2E4850

      # --------------------------------------------------------- 03 / habits --
      - name: Behavioural profile
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          committer_token: ${{ secrets.GITHUB_TOKEN }}
          committer_message: "chore(metrics): habits [skip ci]"
          filename: metrics/habits.svg
          template: terminal
          base: ""
          config_timezone: Europe/Madrid
          extras_css: ${{ steps.skin.outputs.css }}
          plugins_errors_fatal: no
          retries: 3
          retries_delay: 120
          plugin_habits: yes
          plugin_habits_from: 200
          plugin_habits_days: 14
          plugin_habits_facts: yes
          plugin_habits_charts: yes
          plugin_habits_trim: yes

      # ---------------------------------------------------------- 04 / reach --
      - name: Reach and footprint
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          committer_token: ${{ secrets.GITHUB_TOKEN }}
          committer_message: "chore(metrics): reach [skip ci]"
          filename: metrics/reach.svg
          template: terminal
          base: ""
          config_timezone: Europe/Madrid
          extras_css: ${{ steps.skin.outputs.css }}
          plugins_errors_fatal: no
          retries: 3
          retries_delay: 120
          plugin_lines: yes
          plugin_lines_sections: base
          plugin_notable: yes
          plugin_notable_repositories: yes
          plugin_followup: yes
          plugin_followup_sections: repositories
          plugin_stars: yes
          plugin_stars_limit: 3
