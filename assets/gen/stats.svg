<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 490 280" width="490" height="280"
     font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'DejaVu Sans Mono', monospace" role="img" aria-label="GitHub statistics">

  <defs>
