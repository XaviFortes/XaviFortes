            stroke="#22E6FF" stroke-opacity="0.05" stroke-width="0.8"/>
    </pattern>
    <clipPath id="clipST"><rect x="0" y="0" width="490" height="280"/></clipPath>
  </defs>
  <g clip-path="url(#clipST)">
